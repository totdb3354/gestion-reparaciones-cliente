<style>

<script>
'use strict';
// ───────────────────────── datos de ejemplo (inventados) ─────────────────────────
const TASA = { EUR: 1, USD: 0.92 };
const PROVS = [
  { id: 1, nombre: 'PantallasPro', divisa: 'EUR' },
  { id: 2, nombre: 'MobileParts HK', divisa: 'USD' },
  { id: 3, nombre: 'BateríasYa', divisa: 'EUR' },
  { id: 4, nombre: 'Repuestos Express', divisa: 'EUR' },
];
// pedir = «Pedir 60 d» de las piezas en modo Auto (null = manual o nada que pedir)
const COMPS = [
  { id: 1, tipo: 'lcd-11', pedir: null, ref: 18 }, { id: 2, tipo: 'mc-11', pedir: null, ref: 4.5 },
  { id: 3, tipo: 'lcd-12', pedir: null, ref: 22 }, { id: 4, tipo: 'lcd-12pro', pedir: null, ref: 30 },
  { id: 5, tipo: 'mc-12', pedir: null, ref: 5 }, { id: 6, tipo: 'lcd-13', pedir: 4, ref: 33 },
  { id: 7, tipo: 'lcd-13pro', pedir: null, ref: 38 }, { id: 8, tipo: 'mc-13pro', pedir: null, ref: 6.5 },
  { id: 9, tipo: 'chasis-13pro-azul', pedir: null, ref: 24 }, { id: 10, tipo: 'cami13 / cami13pro', pedir: 0, ref: 14.5 },
  { id: 11, tipo: 'flex-carga-12', pedir: null, ref: 2.9 }, { id: 12, tipo: 'flex-carga-13', pedir: null, ref: 3.1 },
  { id: 13, tipo: 'lcd-14', pedir: null, ref: 52 }, { id: 14, tipo: 'lcd-14pro', pedir: null, ref: 61 },
  { id: 15, tipo: 'tapa-14-negro', pedir: null, ref: 7 }, { id: 16, tipo: 'mc-14', pedir: 3, ref: 5.5 },
  { id: 17, tipo: 'lcd-15', pedir: null, ref: 64 }, { id: 18, tipo: 'bat-11', pedir: null, ref: 7.5 },
  { id: 19, tipo: 'bat-xr', pedir: null, ref: 7 }, { id: 20, tipo: 'bat-12', pedir: null, ref: 9 },
  { id: 21, tipo: 'bat-13', pedir: null, ref: 10.5 }, { id: 22, tipo: 'bat-14', pedir: 6, ref: 11 },
  { id: 23, tipo: 'altavoz-13', pedir: null, ref: 2.4 }, { id: 24, tipo: 'boton-power-12', pedir: null, ref: 1.2 },
  { id: 25, tipo: 'bandeja-sim-14-azul', pedir: null, ref: 0.9 },
];
const ESTADOS = ['pendiente', 'en_camino', 'parcial', 'recibido', 'cancelado'];
const USUARIO = 'supertécnico';

function d(dia, h, m, mes) { return new Date(2026, (mes || 10) - 1, dia, h, m); }
function round2(n) { return Math.round(n * 100) / 100; }
const prov = (id) => PROVS.find((p) => p.id === id);
const comp = (id) => COMPS.find((c) => c.id === id);

function datosIniciales() {
  const bloques = [], lineas = [];
  const B = (id, idProv, fecha, nota, lns, migrado) => {
    bloques.push({ id, idProv, fecha, nota: nota || '', migrado: !!migrado, v: 1 });
    const p = prov(idProv);
    for (const [idL, idCom, cant, precio, estado, x] of lns) {
      const ex = x || {};
      lineas.push({
        id: idL, idBloque: id, idCom, idProv, cantidad: cant,
        recibida: ex.rec !== undefined ? ex.rec : (estado === 'recibido' ? cant : null),
        urgente: !!ex.urg, fecha: ex.fecha || fecha, precio, divisa: p.divisa,
        precioEur: round2(precio * TASA[p.divisa]), estado, v: 1,
      });
    }
  };
  B(47, 1, d(9, 10, 2), '', [[320, 7, 5, 38, 'pendiente'], [321, 8, 5, 6.5, 'pendiente'], [322, 9, 2, 24, 'pendiente', { fecha: d(9, 12, 14) }]]);
  B(46, 3, d(9, 9, 15), '', [[318, 20, 10, 9, 'pendiente'], [319, 21, 8, 10.5, 'pendiente', { urg: true }]]);
  B(45, 2, d(8, 17, 20), 'Ped. MP-88231 · DHL 1Z999AA10123456784', [[314, 10, 4, 15.5, 'en_camino'], [315, 13, 3, 56, 'en_camino', { urg: true }], [316, 12, 6, 3.4, 'en_camino'], [317, 14, 2, 66, 'en_camino']]);
  B(44, 1, d(8, 10, 5), 'Pagado con tarjeta, factura PP-2291', [[309, 3, 4, 22, 'en_camino', { urg: true }], [310, 4, 3, 30, 'recibido'], [311, 15, 2, 7, 'parcial', { rec: 1 }], [312, 5, 4, 5, 'pendiente', { fecha: d(8, 16, 40) }]]);
  B(43, 1, d(7, 16, 45), '', [[308, 17, 2, 64, 'en_camino']]);
  B(42, 4, d(6, 11, 30), '', [[305, 23, 5, 2.4, 'recibido'], [306, 24, 10, 1.2, 'recibido'], [307, 25, 4, 0.9, 'recibido']]);
  B(41, 3, d(3, 9, 40), '', [[303, 18, 6, 7.5, 'recibido'], [304, 19, 4, 7, 'cancelado']]);
  B(40, 2, d(1, 18, 0), 'Ped. MP-87990', [[300, 6, 6, 36, 'recibido'], [301, 10, 2, 15.5, 'recibido'], [302, 11, 5, 3.2, 'recibido']]);
  B(39, 1, d(29, 10, 10, 9), '', [[296, 1, 3, 18, 'recibido'], [297, 2, 3, 4.5, 'recibido']], true);
  return { bloques, lineas, log: [] };
}

let S, U, reloj, sigL, sigB, toastT;
function reiniciar(conservarVista) {
  S = datosIniciales();
  reloj = new Date(2026, 9, 9, 12, 30);
  sigL = 330; sigB = 48;
  const prev = U;
  U = {
    rol: 'super', tipo: 'componentes', agrupar: true, manual: {}, manualFiltro: {},
    f: { estados: new Set(), provs: new Set(), texto: '', desde: '', hasta: '' },
    pop: null, sel: null, menu: null, dlg: null, dlgPrev: null, guia: true, logAbierto: true,
  };
  if (conservarVista && prev) { U.rol = prev.rol; U.guia = prev.guia; }
}
function ahora() { reloj = new Date(reloj.getTime() + 60000); return new Date(reloj); }

// ───────────────────────── reglas derivadas ─────────────────────────
const lin = (id) => S.lineas.find((l) => l.id === id);
const bloque = (id) => S.bloques.find((b) => b.id === id);
const porFecha = (a, b) => b.fecha - a.fecha || b.id - a.id;
const lineasDe = (idB) => S.lineas.filter((l) => l.idBloque === idB).sort((a, b) => a.fecha - b.fecha || a.id - b.id);
const unidades = (l) => (l.estado === 'recibido' && l.recibida != null ? l.recibida : l.cantidad);
const totalFila = (l) => unidades(l) * l.precioEur;
const llevaAviso = (l) => l.urgente && (l.estado === 'en_camino' || l.estado === 'parcial');
const chipTxt = (e) => e.replace('_', ' ');
const esAbierto = (idB) => lineasDe(idB).every((l) => l.estado === 'pendiente');
const esVivo = (idB) => lineasDe(idB).some((l) => ['pendiente', 'en_camino', 'parcial'].includes(l.estado));
const situacion = (idB) => (esAbierto(idB) ? 'abierto' : esVivo(idB) ? 'en curso' : 'terminado');
const totalBloque = (idB) => lineasDe(idB).filter((l) => l.estado !== 'cancelado').reduce((s, l) => s + totalFila(l), 0);
const abiertosDe = (idProv) => S.bloques.filter((b) => b.idProv === idProv && esAbierto(b.id)).sort(porFecha);
const destinoPorDefecto = (idProv) => { const a = abiertosDe(idProv); return a.length ? a[0].id : 'nuevo'; };
function resumen(idB) { const c = {}; lineasDe(idB).forEach((l) => { c[l.estado] = (c[l.estado] || 0) + 1; }); return c; }
function textoCantidad(l) {
  if (l.estado === 'parcial') return l.recibida != null ? `${l.recibida}/${l.cantidad}` : String(l.cantidad);
  if (l.estado === 'recibido') return String(l.recibida ?? l.cantidad);
  return String(l.cantidad);
}

// ───────────────────────── formato ─────────────────────────
const p2 = (n) => String(n).padStart(2, '0');
const fFecha = (x) => `${p2(x.getDate())}/${p2(x.getMonth() + 1)}/${String(x.getFullYear()).slice(2)} ${p2(x.getHours())}:${p2(x.getMinutes())}`;
const fDia = (x) => `${p2(x.getDate())}/${p2(x.getMonth() + 1)}/${x.getFullYear()}`;
const fCorto = (x) => `${p2(x.getDate())}/${p2(x.getMonth() + 1)}`;
const fHora = (x) => `${p2(x.getHours())}:${p2(x.getMinutes())}`;
const fNum = (n) => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fImp = (n, div) => fNum(n) + (div === 'USD' ? ' $' : ' €');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nLineas = (n) => `${n} ${n === 1 ? 'línea' : 'líneas'}`;

// ───────────────────────── filtros ─────────────────────────
function filtroActivo() { const f = U.f; return !!(f.estados.size || f.provs.size || f.texto.trim() || f.desde || f.hasta); }
function cumple(l) {
  const f = U.f;
  if (f.estados.size && !f.estados.has(l.estado)) return false;
  if (f.provs.size && !f.provs.has(l.idProv)) return false;
  const t = f.texto.trim().toLowerCase();
  if (t && !comp(l.idCom).tipo.toLowerCase().includes(t)) return false;
  if (f.desde && l.fecha < new Date(f.desde + 'T00:00:00')) return false;
  if (f.hasta && l.fecha > new Date(f.hasta + 'T23:59:59')) return false;
  return true;
}
function desplegado(idB) {
  if (filtroActivo()) return U.manualFiltro[idB] ?? true;
  return U.manual[idB] ?? esVivo(idB);
}
function filtrosCambiados() { U.manualFiltro = {}; renderBarra(); renderTabla(); }

// ───────────────────────── registro y operaciones ─────────────────────────
function registrar(accion, detalle, usuario) { S.log.push({ t: new Date(reloj), usuario: usuario || USUARIO, accion, detalle }); }
function crearBloque(idProv) {
  const b = { id: sigB++, idProv, fecha: ahora(), nota: '', migrado: false, v: 1 };
  S.bloques.push(b);
  registrar('CREAR_BLOQUE', `Bloque ${b.id}, PROVEEDOR: ${prov(idProv).nombre}`);
  U.manual[b.id] = true;
  return b;
}
function limpiarVacio(idB) {
  if (lineasDe(idB).length) return false;
  S.bloques = S.bloques.filter((b) => b.id !== idB);
  registrar('BORRAR_BLOQUE', `Bloque ${idB} (se quedó sin líneas)`);
  return true;
}
function moverLinea(idL, destino, motivo) {
  const l = lin(idL);
  const origen = l.idBloque;
  const idDest = destino === 'nuevo' ? crearBloque(l.idProv).id : destino;
  l.idBloque = idDest; l.v++;
  registrar('MOVER_LINEA_BLOQUE', `ID_COMPRA: ${l.id} (${comp(l.idCom).tipo}, ${chipTxt(l.estado)}), DE: Bloque ${origen} A: Bloque ${idDest}${motivo ? ', ' + motivo : ''}`);
  const vacio = limpiarVacio(origen);
  U.manual[idDest] = true;
  return { idDest, origen, vacio };
}

  it.push({ t: 'Mover a bloque', sub: destinosMover(l) });

  const otros = S.bloques.filter((b) => b.idProv === l.idProv && b.id !== l.idBloque).sort(porFecha).slice(0, 8);

  return sub;

// ───────────────────────── acciones de línea (como hoy) ─────────────────────────
function transLinea(idL, acc) {
  const l = lin(idL);
  const tipo = comp(l.idCom).tipo;
  if (acc === 'confirmar') { l.estado = 'en_camino'; registrar('CONFIRMAR_PEDIDO', `ID_COMPRA: ${l.id} (${tipo})`); }
  if (acc === 'recibido') { l.estado = 'recibido'; l.recibida = l.cantidad; registrar('RECIBIR_PEDIDO', `ID_COMPRA: ${l.id}, COMPONENTE: ${tipo}, CANT: ${l.cantidad}`); }
  if (acc === 'cerrar') { l.estado = 'recibido'; registrar('CONFIRMAR_ALTERADO', `ID_COMPRA: ${l.id} (${tipo})`); }
  if (acc === 'cancelar') { l.estado = 'cancelado'; registrar('CANCELAR_PEDIDO', `ID_COMPRA: ${l.id} (${tipo})`); }
  if (acc === 'revertir') { l.estado = 'en_camino'; l.recibida = null; registrar('DESRECIBIR_PEDIDO', `ID_COMPRA: ${l.id} (${tipo})`); }
  if (acc === 'borrar') {
    S.lineas = S.lineas.filter((x) => x.id !== idL);
    registrar('BORRAR_PEDIDO', `ID_COMPRA: ${l.id} (${tipo})`);
    if (limpiarVacio(l.idBloque)) toast(`Línea borrada. El Bloque ${l.idBloque} se quedó vacío y desaparece.`);
  }
  l.v++;
  renderTodo();
}

  recibir: { titulo: 'Recibir todo', de: 'en_camino', boton: 'Recibir', cambian: 'Se reciben (suman al stock)', peligro: false },
  cancelar: { titulo: 'Cancelar bloque', de: 'en_camino', boton: 'Cancelar líneas', cambian: 'Se cancelan (no se pueden reactivar)', peligro: true },

function razonNo(l, acc) {
  const E = l.estado;
  if (acc === 'confirmar') return E === 'cancelado' ? 'cancelado' : `ya ${chipTxt(E)}`;
  if (acc === 'recibir') {
    if (E === 'pendiente') return 'pendiente: aún no se ha pedido';
    if (E === 'parcial') return `parcial (${l.recibida}/${l.cantidad}): usa «Recibir resto» en su fila`;
    return E === 'recibido' ? 'ya recibido' : 'cancelado';
  }
  if (acc === 'cancelar') {
    if (E === 'pendiente') return 'pendiente: se borra, no se cancela';
    if (E === 'parcial') return 'parcial: usa «Cerrar sin resto» en su fila';
    return E === 'recibido' ? 'ya recibido' : 'ya cancelado';
  }
  return chipTxt(E);
}

function ejecutarAccionBloque() {

  if (!valido) {

function lineaVacia(D) { return { idCom: null, idProv: D.provGeneral, cant: 1, precio: 0, urg: false }; }
function gruposNuevo(D) {
  const m = new Map();
  D.lineas.forEach((x) => { if (x.idProv) m.set(x.idProv, (m.get(x.idProv) || 0) + 1); });
  return [...m.entries()];

function anadirPrevision() {
  const D = U.dlg;

  for (const c of COMPS.filter((c) => c.pedir > 0)) {
    const ya = D.lineas.find((x) => x.idCom === c.id);
    if (ya) ya.cant = Math.max(ya.cant, c.pedir);
    else D.lineas.push({ idCom: c.id, idProv: D.provGeneral, cant: c.pedir, precio: c.ref, urg: false });
    n++;
  }
  D.info = `Previsión: ${n} piezas en modo Auto con «Pedir 60 d» > 0 (se ha saltado 1 con 0: cami13 / cami13pro).`;
  D.error = null;
  renderDlg();
}
function confirmarNuevo() {
  const D = U.dlg;
  if (!D.lineas.length) { D.error = 'Añade al menos una línea.'; renderDlg(); return; }
  for (let i = 0; i < D.lineas.length; i++) {
    const x = D.lineas[i];
    if (!x.idCom) { D.error = `Línea ${i + 1}: selecciona un componente.`; renderDlg(); return; }
    if (!x.idProv) { D.error = `Línea ${i + 1}: selecciona un proveedor.`; renderDlg(); return; }
    if (!(x.cant > 0)) { D.error = `Línea ${i + 1}: la cantidad debe ser mayor que 0.`; renderDlg(); return; }
    if (!(x.precio >= 0)) { D.error = `Línea ${i + 1}: el precio no puede ser negativo.`; renderDlg(); return; }
  }
  const resumenToast = [];
  for (const [idProv, n] of gruposNuevo(D)) {
    let dest = D.modo === 'bloque' ? D.idBloque : (D.destinos[idProv] ?? destinoPorDefecto(idProv));
    let esNuevo = false;
    if (dest === 'nuevo') { dest = crearBloque(idProv).id; esNuevo = true; }
    for (const x of D.lineas.filter((y) => y.idProv === idProv)) {
      const p = prov(idProv);
      const l = { id: sigL++, idBloque: dest, idCom: x.idCom, idProv, cantidad: x.cant, recibida: null, urgente: x.urg, fecha: ahora(), precio: x.precio, divisa: p.divisa, precioEur: round2(x.precio * TASA[p.divisa]), estado: 'pendiente', v: 1 };
      S.lineas.push(l);
      registrar('CREAR_PEDIDO', `ID_COMPRA: ${l.id}, COMPONENTE: ${comp(x.idCom).tipo}, PROVEEDOR: ${p.nombre}, CANT: ${x.cant}, Bloque ${dest}`);
    }

    resumenToast.push(`Bloque ${dest}${esNuevo ? ' (nuevo)' : ''}: ${n}`);

  cerrarDlg(); renderTodo();
}

        <div class="caja info">Al cambiar el proveedor, la línea sale del Bloque ${l.idBloque} y pasa a un bloque de <b>${esc(pr.nombre)}</b>. ${l.estado === 'pendiente' ? 'Sugerido: su bloque abierto, si tiene.' : 'Como ya se pidió, se sugiere un bloque nuevo.'}${pr.divisa !== prov(l.idProv).divisa ? ` <b>Ojo:</b> ${esc(pr.nombre)} trabaja en ${pr.divisa}; revisa el precio.` : ''}</div>`;
    }
    return `<div class="dlg"><h2>Editar pedido</h2><div class="sub"><b>${esc(comp(l.idCom).tipo)}</b> · ID ${l.id} · Bloque ${l.idBloque} · ${chipTxt(l.estado)}</div><div class="cuerpo">
      <label class="campo"><span>Proveedor</span><select data-ed="idProv">${PROVS.map((p) => `<option value="${p.id}" ${D.idProv === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></label>
      ${bloqueCampo}
      <div class="fila-campos">
        <label class="campo"><span>Cantidad</span><input type="number" min="1" data-ed="cant" value="${D.cant}" ${cantDis ? 'disabled title="En recibido no se cambia la cantidad"' : ''} style="width:100px"></label>
        <label class="campo"><span>P.Unit. (${pr.divisa})</span><input type="number" min="0" step="0.01" data-ed="precio" value="${D.precio}" style="width:110px"></label>
        <label class="campo"><span>Urgente</span><input type="checkbox" data-ed="urg" ${D.urg ? 'checked' : ''} style="margin-top:6px"></label>
      </div>
      ${D.error ? `<div class="caja error">${esc(D.error)}</div>` : ''}</div>
      ${pie('', `${cancelar}<button class="btn prim" data-a="editarOk">Guardar</button>`)}</div>`;
  }
  if (D.tipo === 'nuevo') {
    const fijo = D.modo === 'bloque';
    const b = fijo ? bloque(D.idBloque) : null;
    const titulo = fijo ? `Añadir líneas · Bloque ${b.id}` : 'Nuevo pedido';
    const sub = fijo ? `<div class="sub">${esc(prov(b.idProv).nombre)} · ${situacion(b.id)} · las líneas nuevas entran como <b>pendientes</b> y el bloque mostrará «Confirmar bloque (n)».</div>` : '';
    const nPrev = COMPS.filter((c) => c.pedir > 0).length;
    const optsComp = (sel) => `<option value="">Escribe componente...</option>${COMPS.map((c) => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(c.tipo)}</option>`).join('')}`;
    const optsProv = (sel) => `<option value=""></option>${PROVS.map((p) => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}`;
    const filas = D.lineas.map((x, i) => `<tr>
      <td class="n">${i + 1}</td>
      <td><select data-nl="${i}" data-k="idCom">${optsComp(x.idCom)}</select></td>
      <td>${fijo ? `<span class="fijo">${esc(prov(b.idProv).nombre)}</span>` : `<select data-nl="${i}" data-k="idProv">${optsProv(x.idProv)}</select>`}</td>
      <td><input type="number" min="1" data-nl="${i}" data-k="cant" value="${x.cant}"></td>
      <td><input type="number" min="0" step="0.01" data-nl="${i}" data-k="precio" value="${x.precio}"> <span class="div">${x.idProv ? (prov(x.idProv).divisa === 'USD' ? '$' : '€') : ''}</span></td>
      <td><input type="checkbox" data-nl="${i}" data-k="urg" ${x.urg ? 'checked' : ''}></td>
      <td><button class="quitar" data-a="nlQuitar" data-i="${i}" title="Quitar línea">✕</button></td></tr>`).join('');
    const grupos = gruposNuevo(D);
    let dest = '';
    if (fijo) {
      dest = D.lineas.length ? `<div class="dest"><b>${esc(prov(b.idProv).nombre)}</b> (${nLineas(D.lineas.length)}) <span class="flecha">→</span> <b>Bloque ${b.id}</b> <span class="idc">(fijado)</span></div>` : '<div class="idc">Añade líneas para ver su destino.</div>';
    } else {
      dest = grupos.map(([idProv, n]) => {
        const ab = abiertosDe(idProv);
        const val = D.destinos[idProv] ?? destinoPorDefecto(idProv);
        const ctrl = ab.length
          ? `<select data-dest="${idProv}">${ab.map((bb) => `<option value="${bb.id}" ${val === bb.id ? 'selected' : ''}>Añadir a Bloque ${bb.id} · ${fCorto(bb.fecha)} · ${nLineas(lineasDe(bb.id).length)}</option>`).join('')}<option value="nuevo" ${val === 'nuevo' ? 'selected' : ''}>Bloque nuevo</option></select>`
          : '<b>Bloque nuevo</b> <span class="idc">(no tiene ninguno abierto)</span>';
        return `<div class="dest"><b>${esc(prov(idProv).nombre)}</b> (${nLineas(n)}) <span class="flecha">→</span> ${ctrl}</div>`;
      }).join('');
      const sinProv = D.lineas.filter((x) => !x.idProv).length;
      if (sinProv) dest += `<div class="dest idc">${nLineas(sinProv)} sin proveedor todavía</div>`;
      if (!D.lineas.length) dest = '<div class="idc">Añade líneas: aquí verás a qué bloque va cada proveedor.</div>';
    }
    return `<div class="dlg ancho"><h2>${titulo}</h2>${sub}<div class="cuerpo">
      <div class="barra-nuevo"><b>Proveedor:</b>
        ${fijo ? `<span class="fijo">${esc(prov(b.idProv).nombre)}</span>` : `<select id="provGeneral">${optsProv(D.provGeneral)}</select>
        <button class="btn" data-a="aplicarTodas" ${D.provGeneral && D.lineas.length ? '' : 'disabled'}>Aplicar a todas</button>`}
        <button class="btn" data-a="prevision">Añadir previsión (${nPrev})</button>
      </div>
      <table class="lineas-nuevo"><thead><tr><th></th><th>Componente</th><th style="width:170px">Proveedor</th><th>Cant.</th><th>P.Unit.</th><th>Urg.</th><th></th></tr></thead>
      <tbody>${filas || '<tr><td colspan="7" class="idc" style="padding:14px">Sin líneas. Usa «+ Añadir línea» o «Añadir previsión».</td></tr>'}</tbody></table>
      <button class="btn link" data-a="nlAnadir">+ Añadir línea</button>
      ${D.info ? `<div class="caja info">${esc(D.info)}</div>` : ''}
      <div class="destinos"><h4>Bloques</h4>${dest}
        ${fijo ? '' : '<div class="idc" style="margin-top:6px;font-size:11.5px">Solo se ofrecen bloques <b>abiertos</b> (sin nada confirmado). Para sumar a uno ya confirmado: ⋮ del bloque → «Añadir líneas…».</div>'}</div>
      ${D.error ? `<div class="caja error">${esc(D.error)}</div>` : ''}</div>
      ${pie('', `<button class="btn" data-a="dlgCancelar">Atrás</button><button class="btn prim" data-a="nuevoOk">Confirmar</button>`)}</div>`;
  }
  if (D.tipo === 'csv') {
    const ls = ordenVista();
    const cab = 'ID;Bloque;Nota del bloque;Pedido;Componente;Proveedor;Cant.;P.Unit.;Divisa;EUR;Estado';
    const filas = ls.slice(0, 16).map((l) => [l.id, l.idBloque, bloque(l.idBloque).nota, fFecha(l.fecha), comp(l.idCom).tipo, prov(l.idProv).nombre, textoCantidad(l), fNum(l.precio), l.divisa, fNum(totalFila(l)), l.estado].join(';'));
    return `<div class="dlg ancho"><h2>CSV de pedidos</h2><div class="sub">Siempre plano, en el orden de la vista y con los filtros aplicados. Columnas nuevas: <b>Bloque</b> y <b>Nota del bloque</b>.</div><div class="cuerpo">
      <pre class="csv">${esc([cab, ...filas].join('\n'))}${ls.length > 16 ? `\n… (${ls.length} filas en total)` : ''}</pre></div>
      ${pie('', '<button class="btn prim" data-a="dlgCancelar">Cerrar</button>')}</div>`;
  }
  return '';
}
function renderDlg() {
  const el = document.getElementById('dlg');
  if (!U.dlg) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="overlay">${htmlDlg(U.dlg)}</div>`;
  const f = el.querySelector('#cantTxt, #notaTxt');
  if (f) { f.focus(); if (f.select) f.select(); }
}

// ───────────────────────── toast y render general ─────────────────────────
function toast(txt) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast">${esc(txt)}</div>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.innerHTML = ''; }, 3800);
}
function renderTodo() { renderProto(); renderBarra(); renderTabla(); renderLog(); renderMenu(); renderDlg(); }

// ───────────────────────── eventos ─────────────────────────
const ACCIONES = {
  rol: (t) => { U.rol = t.dataset.v; U.menu = null; renderTodo(); },
  guia: () => { U.guia = !U.guia; renderProto(); },
  reiniciar: () => { reiniciar(true); renderTodo(); toast('Datos reiniciados'); },
  tipo: (t) => { U.tipo = t.dataset.v; renderTodo(); },
  pop: (t) => { U.pop = U.pop === t.dataset.v ? null : t.dataset.v; renderBarra(); },
  limpiar: () => { U.f = { estados: new Set(), provs: new Set(), texto: '', desde: '', hasta: '' }; U.pop = null; filtrosCambiados(); },
  agrupar: () => { U.agrupar = !U.agrupar; renderBarra(); renderTabla(); },
  todo: (t) => {
    const v = t.dataset.v === '1';
    const mapa = filtroActivo() ? U.manualFiltro : U.manual;
    S.bloques.forEach((b) => { mapa[b.id] = v; });
    renderBarra(); renderTabla();
  },
  csv: () => { U.dlg = { tipo: 'csv' }; renderDlg(); },
  nuevo: () => { if (U.tipo === 'otros') { toast('«Nuevo otro pedido» sigue como hoy'); return; } abrirNuevo({ modo: 'normal' }); },
  plegar: (t) => {
    const id = Number(t.dataset.id);
    const mapa = filtroActivo() ? U.manualFiltro : U.manual;
    mapa[id] = !desplegado(id);
    renderBarra(); renderTabla();
  },
  menuBloque: (t) => {
    const r = t.getBoundingClientRect();
    abrirMenu(r.right - 230, r.bottom + 4, `Bloque ${t.dataset.id}`, menuBloque(Number(t.dataset.id)));
  },
  comp: (t) => { U.sel = Number(t.dataset.id); renderTabla(); toast(`En la app real iría a Stock con ${comp(lin(Number(t.dataset.id)).idCom).tipo} seleccionado`); },
  dlgCancelar: () => cancelarDlg(),
  dlgOk: () => { const ok = U.dlg.ok; U.dlg = null; U.dlgPrev = null; renderDlg(); ok(); },
  cantOk: () => confirmarCantidad(),
  accionOk: () => ejecutarAccionBloque(),
  simular: () => simularOtro(),
  separarOk: () => ejecutarSeparar(),
  juntarOk: () => ejecutarJuntar(),
  notaOk: () => guardarNota(),
  editarOk: () => guardarEditar(),
  nuevoOk: () => confirmarNuevo(),
  prevision: () => anadirPrevision(),
  aplicarTodas: () => { const D = U.dlg; D.lineas.forEach((x) => { x.idProv = D.provGeneral; }); renderDlg(); },
  nlAnadir: () => { const D = U.dlg; D.lineas.push(lineaVacia(D)); D.error = null; renderDlg(); },
  nlQuitar: (t) => { const D = U.dlg; D.lineas.splice(Number(t.dataset.i), 1); D.error = null; renderDlg(); },
};

document.addEventListener('click', (e) => {
  const enMenu = e.target.closest('.menu');
  if (enMenu) {
    const mi = e.target.closest('[data-mi]');
    if (!mi) return;
    const it = itemDeRuta(mi.dataset.mi);
    if (!it || it.dis || it.sub) return;
    U.menu = null; renderMenu();
    it.fn();
    return;
  }
  const t = e.target.closest('[data-a]');
  if (U.menu) { U.menu = null; renderMenu(); if (!t || t.dataset.a !== 'menuBloque') { if (!t) return; } }
  if (U.pop && !e.target.closest('.pop') && !(t && t.dataset.a === 'pop')) { U.pop = null; renderBarra(); }
  if (t) { const f = ACCIONES[t.dataset.a]; if (f) f(t, e); return; }
  const tr = e.target.closest('tr.fila');
  if (tr) { U.sel = Number(tr.dataset.id); renderTabla(); }
});

document.addEventListener('contextmenu', (e) => {
  const tr = e.target.closest('tr.fila, tr.cab');
  if (!tr) return;
  e.preventDefault();
  if (U.rol !== 'super') { toast('El administrador solo consulta: sin menús'); return; }
  if (tr.classList.contains('cab')) {
    const id = Number(tr.dataset.bloque);
    abrirMenu(e.clientX, e.clientY, `Bloque ${id}`, menuBloque(id));
  } else {
    const l = lin(Number(tr.dataset.id));
    U.sel = l.id; renderTabla();
    abrirMenu(e.clientX, e.clientY, `${comp(l.idCom).tipo} · ID ${l.id}`, menuLinea(l));
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'buscar') { U.f.texto = t.value; U.manualFiltro = {}; renderTabla(); return; }
  if (t.id === 'notaTxt') { document.getElementById('notaCont').textContent = `${t.value.length}/200`; return; }
  if (t.dataset.nl !== undefined && (t.dataset.k === 'cant' || t.dataset.k === 'precio')) {
    U.dlg.lineas[Number(t.dataset.nl)][t.dataset.k] = Number(t.value); return;
  }
  if (t.dataset.ed === 'cant' || t.dataset.ed === 'precio') { U.dlg[t.dataset.ed] = Number(t.value); }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'desde' || t.id === 'hasta') { U.f[t.id] = t.value; filtrosCambiados(); return; }
  if (t.dataset.fe) { const s = U.f.estados; t.checked ? s.add(t.dataset.fe) : s.delete(t.dataset.fe); filtrosCambiados(); return; }
  if (t.dataset.fp) { const s = U.f.provs, v = Number(t.dataset.fp); t.checked ? s.add(v) : s.delete(v); filtrosCambiados(); return; }
  const D = U.dlg;
  if (!D) return;
  if (t.id === 'provGeneral') {
    D.provGeneral = t.value ? Number(t.value) : null;
    if (D.provGeneral) D.lineas.forEach((x) => { if (!x.idProv) x.idProv = D.provGeneral; });
    renderDlg(); return;
  }
  if (t.dataset.nl !== undefined) {
    const x = D.lineas[Number(t.dataset.nl)], k = t.dataset.k;
    if (k === 'idCom') { x.idCom = t.value ? Number(t.value) : null; if (x.idCom && !x.precio) x.precio = comp(x.idCom).ref; }
    if (k === 'idProv') x.idProv = t.value ? Number(t.value) : null;
    if (k === 'urg') x.urg = t.checked;
    if (k === 'cant' || k === 'precio') x[k] = Number(t.value);
    D.error = null; renderDlg(); return;
  }
  if (t.dataset.dest) { D.destinos[Number(t.dataset.dest)] = t.value === 'nuevo' ? 'nuevo' : Number(t.value); return; }
  if (t.dataset.ed === 'idProv') {
    const l = lin(D.idL);
    D.idProv = Number(t.value);
    D.destino = D.idProv === l.idProv ? null : (l.estado === 'pendiente' ? destinoPorDefecto(D.idProv) : 'nuevo');
    renderDlg(); return;
  }
  if (t.dataset.ed === 'destino') { D.destino = t.value === 'nuevo' ? 'nuevo' : Number(t.value); return; }
  if (t.dataset.ed === 'urg') { D.urg = t.checked; return; }
  if (t.dataset.sep) { const id = Number(t.dataset.sep); t.checked ? D.marcadas.add(id) : D.marcadas.delete(id); renderDlg(); return; }
  if (t.name === 'juntar') { D.destino = Number(t.value); renderDlg(); }
});

document.addEventListener('toggle', (e) => { if (e.target.id === 'logDet') U.logAbierto = e.target.open; }, true);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (U.menu) { cerrarMenu(); return; }
  if (U.pop) { U.pop = null; renderBarra(); return; }
  if (U.dlg) cancelarDlg();
});

reiniciar(false);
renderTodo();
</script>
</body>
</html>
